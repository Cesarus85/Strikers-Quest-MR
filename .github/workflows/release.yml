name: release

# Publica o APK que está em apk/ como um release, quando uma tag v* é enviada.
#
# NÃO COMPILA AQUI, e isso é deliberado. O lado nativo precisa do NDK, do pacote
# pré-compilado do Dawn e de uns dez minutos de CMake; um runner que falha por
# uma dependência que se moveu produziria releases vazios de vez em quando. O
# que está em apk/ é o arquivo que foi compilado e conferido em máquina, e é
# esse que deve chegar a quem baixa. Se um dia a compilação em CI ficar confiável,
# ela entra como um segundo job que substitui o arquivo antes deste passo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A tag a publicar (ex.: v1.2.0). Precisa existir.'
        required: true

# O GITHUB_TOKEN vem do próprio Actions e vale só para este repositório e esta
# execução. Nenhum segredo precisa ser cadastrado.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o APK antes de publicar
        id: apk
        run: |
          set -euo pipefail
          apk=$(ls apk/*.apk)
          echo "caminho=$apk" >> "$GITHUB_OUTPUT"
          echo "nome=$(basename "$apk")" >> "$GITHUB_OUTPUT"
          # O sha256 que está no repositório tem de bater com o arquivo. Um release
          # cujo checksum não confere é pior do que um release que não sai: quem
          # baixa confere, não bate, e não sabe se o problema é o arquivo ou a lista.
          ( cd apk && sha256sum -c ./*.sha256 )
          echo "tamanho=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notas=$(mktemp)
          cat > "$notas" <<NOTAS
          Super Mario Strikers rodando nativo em Android arm64.

          **\`${{ steps.apk.outputs.nome }}\`** — ${{ steps.apk.outputs.tamanho }}, arm64-v8a,
          Android 9 (API 28) ou mais novo, com Vulkan.

          **Nenhum arquivo do jogo acompanha isto.** O app não inicia o jogo até
          você fornecer a sua própria cópia do disco: uma imagem \`.iso\`, \`.gcm\`,
          \`.ciso\` ou \`.gcz\`, ou a pasta \`files\` de um disco extraído. O launcher
          mostra a pasta exata e oferece copiar o caminho.

          Confira o que você baixou:

          \`\`\`sh
          sha256sum -c ${{ steps.apk.outputs.nome }}.sha256
          \`\`\`

          O APK é assinado com a **chave de depuração** do SDK do Android — a mesma
          que toda instalação do SDK tem. Isso basta para o sistema instalar, e não
          basta para provar quem construiu. O checksum acima e o fato de você poder
          reconstruir o arquivo a partir do código deste repositório são o que diz
          de onde ele veio.
          NOTAS

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.apk.outputs.caminho }}" apk/*.sha256 --clobber
          else
            gh release create "$TAG" \
              "${{ steps.apk.outputs.caminho }}" apk/*.sha256 \
              --title "Strikers para Android $TAG" \
              --notes-file "$notas"
          fi
